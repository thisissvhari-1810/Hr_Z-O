# ----------------------------------------------------------------------
# nginx config for the PeopleFlow frontend.
# Serves static files and reverse-proxies /api/* to the Node backend.
# ----------------------------------------------------------------------

server {
  listen      80;
  server_name _;
  root        /usr/share/nginx/html;
  index       index.html;

  # Gzip text assets.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    application/manifest+json
    image/svg+xml;

  # Hash-busted assets get a long-lived cache.
  location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|ico|woff2?|ttf|otf)$ {
    expires 30d;
    add_header Cache-Control "public, no-transform";
    try_files $uri =404;
  }

  # HTML files should never be stale.
  location ~* \.html$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Reverse-proxy /api/* to the backend container.
  # "backend" is the service name in docker-compose.yaml.
  location /api/ {
    proxy_pass         http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # SPA-style fallback: unknown paths go to the custom 404 page.
  location / {
    try_files $uri $uri/ $uri.html /404.html;
  }

  # Custom 404 page.
  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
